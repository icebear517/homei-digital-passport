<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#284d3a">
  <title>數位和美幫｜靜態展示版</title>
  <link rel="stylesheet" href="./static.css?v=style-fix-3">
</head>
<body>
  <main>
    <header><div class="mark">和</div><div><strong>數位和美幫</strong><small>數位集章活動・靜態展示版</small></div><button id="reset">重設</button></header>
    <p class="notice">展示版資料只保存在此瀏覽器；正式 LIFF 串接後會改由伺服器保存。</p>
    <section class="hero"><span>503 文具店展示版</span><h1>把和美，<em>一站一站集起來。</em></h1><p>到合作店家掃 QR，集滿三間不同店家即可轉盤。</p></section>
    <section class="passport"><div><small>MY STAMP PASSPORT</small><b id="count">00</b><span>枚不同店家章</span></div><p id="status"></p><button id="go-draw">前往幸運轉盤 ↗</button></section>
    <h2>我的探店印記</h2><div id="stamps" class="stamps"></div>
    <p class="hint">展示時點選下方店家即可模擬掃描店內 QR 並集章。</p>
    <h2>合作店家</h2><div id="shops" class="shops"></div>
    <section id="draw" class="draw"><h2>幸運轉盤</h2><div id="wheel">轉</div><p id="draw-status"></p><button id="spin">轉動幸運轉盤</button><div id="coupons"></div></section>
  </main>
  <div id="spin-screen" class="spin-screen" hidden><div><div class="mini-wheel">轉</div><p class="spin-word">轉<span>轉</span><i>轉</i>！</p><small>幸運正在靠近…</small></div></div>
  <script src="./static.js?v=merchant-name-5"></script>
</body>
</html>
